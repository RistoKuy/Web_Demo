<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49',
            }
          }
        }
      }
    }
  </script>
  <style>
    .tech-tag {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 500;
      border-radius: 0.375rem;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .dark .tech-tag {
      background-color: #1e293b;
      color: #cbd5e1;
      border-color: rgba(51, 65, 85, 0.8);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased transition-colors duration-300">

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div id="navInitials" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm overflow-hidden shrink-0"></div>
        <div>
          <span id="navName" class="font-bold text-base sm:text-lg tracking-tight block"></span>
          <span id="navRole" class="text-xs text-sky-600 dark:text-sky-400 font-medium"></span>
        </div>
      </div>

      <nav id="navLinks" class="hidden md:flex items-center space-x-1 lg:space-x-2 text-sm font-medium"></nav>

      <div class="flex items-center space-x-2">
        <button id="themeToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" aria-label="Toggle Dark Mode">
          <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i>
        </button>
        <button id="mobileMenuBtn" class="md:hidden p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" aria-label="Open Menu">
          <i data-lucide="menu" id="mobileMenuIcon" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
    <!-- Mobile dropdown navigation -->
    <div id="mobileMenu" class="hidden md:hidden border-t border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md px-4 py-3 space-y-1"></div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-12">

    <!-- Hero Section -->
    <section id="about" class="pt-4 sm:pt-8">
      <div id="heroContainer" class="bg-gradient-to-br from-white to-slate-100 dark:from-slate-900 dark:to-slate-800/60 rounded-3xl p-6 sm:p-10 border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden">
        <!-- Rendered from data.json -->
      </div>
    </section>

    <!-- Technical Projects Section -->
    <section id="projects" class="space-y-6">
      <div id="projectsHeader" class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-4">
        <!-- Rendered from data.json -->
      </div>
      <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Rendered from data.json -->
      </div>
    </section>

    <!-- Skills Matrix Section -->
    <section id="skills" class="space-y-6">
      <div id="skillsHeader" class="border-b border-slate-200 dark:border-slate-800 pb-4">
        <!-- Rendered from data.json -->
      </div>
      <div id="skillsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered from data.json -->
      </div>
    </section>

    <!-- Experience & Education Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Experience Section -->
      <section id="experience" class="space-y-6">
        <div id="experienceHeader" class="border-b border-slate-200 dark:border-slate-800 pb-4">
          <!-- Rendered from data.json -->
        </div>
        <div id="experienceContainer" class="space-y-4">
          <!-- Rendered from data.json -->
        </div>
      </section>

      <!-- Education Section -->
      <section id="education" class="space-y-6">
        <div id="educationHeader" class="border-b border-slate-200 dark:border-slate-800 pb-4">
          <!-- Rendered from data.json -->
        </div>
        <div id="educationContainer" class="space-y-4">
          <!-- Rendered from data.json -->
        </div>
      </section>
    </div>

    <!-- Contact CTA Section -->
    <section id="contact" class="bg-gradient-to-r from-sky-600 to-indigo-700 rounded-3xl p-8 sm:p-12 text-white shadow-lg text-center space-y-6">
      <!-- Rendered from data.json -->
    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-6xl mx-auto px-4" id="footerText"></div>
  </footer>

  <!-- Modular JSON Engine -->
  <script>
    const SVG_ICONS = {
      github: `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>`,
      linkedin: `<svg class="w-4 h-4 fill-current text-sky-600 dark:text-sky-400" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>`,
      linkedinWhite: `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>`
    };

    const BADGE_COLORS = {
      indigo: 'bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800',
      emerald: 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800',
      sky: 'bg-sky-50 dark:bg-sky-950 text-sky-700 dark:text-sky-300 border-sky-200 dark:border-sky-800',
      amber: 'bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800',
      rose: 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800'
    };

    function renderCV(data) {
      // 1. Meta & Header Nav
      if (data.meta?.title) document.title = data.meta.title;
      
      const p = data.profile || {};
      const m = data.metrics || {};
      const sh = data.sectionHeaders || {};

      const navInitialsEl = document.getElementById('navInitials');
      if (p.avatar) {
        navInitialsEl.innerHTML = `<img src="${p.avatar}" alt="${p.name || ''}" class="w-full h-full object-cover">`;
      } else {
        navInitialsEl.textContent = p.initials || '';
      }
      document.getElementById('navName').textContent = p.name || '';
      document.getElementById('navRole').textContent = p.role || '';
      document.getElementById('footerText').innerHTML = `&copy; ${new Date().getFullYear()} ${p.name || ''}. Built with HTML5, Tailwind CSS CDN & JSON data module.`;

      if (data.navigation) {
        const navHtml = data.navigation.map(n => `
          <a href="${n.href}" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition block md:inline-block">${n.label}</a>
        `).join('');
        document.getElementById('navLinks').innerHTML = navHtml;
        const mobNav = document.getElementById('mobileMenu');
        if (mobNav) mobNav.innerHTML = navHtml;
      }

      // 2. Hero Section
      document.getElementById('heroContainer').innerHTML = `
        <div class="absolute -right-16 -top-16 w-64 h-64 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center relative z-10">
          <div class="lg:col-span-8 space-y-4">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 text-xs font-semibold border border-emerald-200 dark:border-emerald-800/60">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              ${p.availability || ''}
            </div>
            
            <div class="flex flex-col sm:flex-row sm:items-center gap-5 sm:gap-7">
              ${p.avatar ? `<img src="${p.avatar}" alt="${p.name || ''}" class="w-24 h-24 sm:w-32 sm:h-32 md:w-36 md:h-36 rounded-3xl object-cover ring-4 ring-white/80 dark:ring-slate-800 shadow-xl shrink-0">` : ''}
              <div>
                <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                  Hi, I'm <span class="bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent">${p.name || ''}</span>
                </h1>
                <p class="text-base sm:text-lg text-slate-600 dark:text-slate-300 font-medium mt-1.5">${p.headline || ''}</p>
              </div>
            </div>
            
            <p class="text-slate-600 dark:text-slate-400 text-sm sm:text-base leading-relaxed">${p.summary || ''}</p>

            <div class="flex flex-wrap gap-2.5 sm:gap-3 pt-2 text-xs sm:text-sm">
              ${p.linkedin ? `
              <a href="${p.linkedin}" target="_blank" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-sky-500 dark:hover:border-sky-500 transition text-slate-700 dark:text-slate-200 font-medium">
                ${SVG_ICONS.linkedin}
                <span>LinkedIn</span>
              </a>` : ''}
              ${p.github ? `
              <a href="${p.github}" target="_blank" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-sky-500 dark:hover:border-sky-500 transition text-slate-700 dark:text-slate-200 font-medium">
                ${SVG_ICONS.github}
                <span>GitHub</span>
              </a>` : ''}
              ${p.email ? `
              <a href="mailto:${p.email}" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-sky-500 dark:hover:border-sky-500 transition text-slate-700 dark:text-slate-200 font-medium">
                <i data-lucide="mail" class="w-4 h-4 text-red-500"></i>
                <span>Email</span>
              </a>` : ''}
              ${p.location ? `
              <div class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-medium">
                <i data-lucide="map-pin" class="w-4 h-4 text-emerald-500"></i>
                <span>${p.location}</span>
              </div>` : ''}
            </div>
          </div>

          <div class="lg:col-span-4 bg-white dark:bg-slate-800/90 rounded-2xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 sm:space-y-5">
            <div class="border-b border-slate-100 dark:border-slate-700 pb-3">
              <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Cumulative GPA</div>
              <div class="text-4xl font-black text-sky-600 dark:text-sky-400 mt-1">${m.gpa || ''} <span class="text-base text-slate-400 font-normal">/ ${m.gpaMax || '4.00'}</span></div>
              <div class="text-xs text-emerald-600 dark:text-emerald-400 font-medium mt-0.5">${m.gpaHonors || ''}</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <div class="text-xs text-slate-400 font-semibold">Core Focus</div>
                <div class="text-sm font-bold text-slate-800 dark:text-slate-200 mt-1">${m.coreFocus || ''}</div>
              </div>
              <div>
                <div class="text-xs text-slate-400 font-semibold">Graduation</div>
                <div class="text-sm font-bold text-slate-800 dark:text-slate-200 mt-1">${m.graduation || ''}</div>
              </div>
            </div>

            <div class="pt-2">
              <a href="#contact" class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-sky-600 hover:bg-slate-800 dark:hover:bg-sky-700 text-white font-semibold text-sm transition shadow-sm">
                <i data-lucide="send" class="w-4 h-4"></i>
                <span>Get In Touch</span>
              </a>
            </div>
          </div>
        </div>
      `;

      // 3. Projects Section Header & Cards
      const projH = sh.projects || {};
      document.getElementById('projectsHeader').innerHTML = `
        <div>
          <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
            <i data-lucide="${projH.icon || 'folder-git-2'}" class="w-6 h-6 text-sky-600 dark:text-sky-400"></i>
            <span>${projH.title || ''}</span>
          </h2>
          ${projH.subtitle ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${projH.subtitle}</p>` : ''}
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 sm:flex-wrap w-full sm:w-auto" id="projectFilter">
          ${(data.projectCategories || []).map((cat, idx) => `
            <button data-filter="${cat.id}" class="filter-btn shrink-0 ${idx === 0 ? 'active bg-sky-600 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700'} px-3 py-1 text-xs font-semibold rounded-full transition">
              ${cat.label}
            </button>
          `).join('')}
        </div>
      `;

      document.getElementById('projectGrid').innerHTML = (data.projects || []).map(proj => `
        <div class="project-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm hover:border-sky-500/50 dark:hover:border-sky-500/50 transition flex flex-col justify-between" data-category="${proj.category}">
          <div class="space-y-4">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="inline-block px-2.5 py-0.5 text-xs font-bold rounded-md border mb-2 ${BADGE_COLORS[proj.badgeColor] || BADGE_COLORS.sky}">
                  ${proj.badge}
                </span>
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-lg text-slate-900 dark:text-white">${proj.title}</h3>
                  ${proj.link ? `<a href="${proj.link}" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-sky-500 transition-colors" title="View Portfolio"><i data-lucide="external-link" class="w-4 h-4"></i></a>` : ''}
                </div>
              </div>
              <span class="text-xs text-slate-400 font-medium whitespace-nowrap">${proj.period}</span>
            </div>
            
            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 leading-relaxed">${proj.summary}</p>
            <ul class="text-xs text-slate-600 dark:text-slate-300 space-y-2">
              ${proj.highlights.map(h => `
                <li class="flex items-start gap-2.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-sky-500 dark:bg-sky-400 mt-1.5 shrink-0"></span>
                  <span class="leading-relaxed">${h}</span>
                </li>
              `).join('')}
            </ul>
          </div>

          <div class="pt-5 mt-4 border-t border-slate-100 dark:border-slate-800 flex flex-wrap gap-1.5">
            ${proj.tags.map(tag => `<span class="tech-tag">${tag}</span>`).join('')}
          </div>
        </div>
      `).join('');

      // 4. Skills Section
      const skillH = sh.skills || {};
      document.getElementById('skillsHeader').innerHTML = `
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
          <i data-lucide="${skillH.icon || 'cpu'}" class="w-6 h-6 text-sky-600 dark:text-sky-400"></i>
          <span>${skillH.title || ''}</span>
        </h2>
        ${skillH.subtitle ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${skillH.subtitle}</p>` : ''}
      `;

      document.getElementById('skillsGrid').innerHTML = (data.skillCategories || []).map(cat => `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 space-y-4 shadow-sm">
          <div class="flex items-center gap-3 text-${cat.color}-600 dark:text-${cat.color}-400 font-bold">
            <div class="p-2 rounded-lg bg-${cat.color}-50 dark:bg-slate-800">
              <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
            </div>
            <h3>${cat.title}</h3>
          </div>
          <ul class="space-y-2.5 text-sm text-slate-600 dark:text-slate-300">
            ${(cat.skills || []).map(s => {
              const name = typeof s === 'string' ? s : s.name;
              return `
                <li class="flex items-center gap-2.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-${cat.color}-500 dark:bg-${cat.color}-400 shrink-0"></span>
                  <span>${name}</span>
                </li>
              `;
            }).join('')}
          </ul>
        </div>
      `).join('');

      // 5. Experience Section
      const expH = sh.experience || {};
      document.getElementById('experienceHeader').innerHTML = `
        <h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
          <i data-lucide="${expH.icon || 'briefcase'}" class="w-5 h-5 text-sky-600 dark:text-sky-400"></i>
          <span>${expH.title || ''}</span>
        </h2>
      `;

      document.getElementById('experienceContainer').innerHTML = (data.experience || []).map(exp => `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-slate-900 dark:text-white">${exp.role}</h3>
              <div class="text-sm font-medium text-sky-600 dark:text-sky-400">${exp.organization}</div>
            </div>
            <span class="text-xs px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-semibold">${exp.period}</span>
          </div>
          <ul class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 space-y-2">
            ${exp.highlights.map(h => `
              <li class="flex items-start gap-2.5">
                <span class="w-1.5 h-1.5 rounded-full bg-sky-500 dark:bg-sky-400 mt-1.5 shrink-0"></span>
                <span class="leading-relaxed">${h}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');

      // 6. Education Section
      const eduH = sh.education || {};
      document.getElementById('educationHeader').innerHTML = `
        <h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
          <i data-lucide="${eduH.icon || 'graduation-cap'}" class="w-5 h-5 text-sky-600 dark:text-sky-400"></i>
          <span>${eduH.title || ''}</span>
        </h2>
      `;

      document.getElementById('educationContainer').innerHTML = (data.education || []).map(edu => `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-slate-900 dark:text-white">${edu.institution}</h3>
              <div class="text-sm font-medium text-slate-600 dark:text-slate-400">${edu.degree}</div>
            </div>
            <span class="text-xs px-2.5 py-1 rounded-md bg-sky-50 dark:bg-sky-950 text-sky-700 dark:text-sky-300 font-semibold border border-sky-200 dark:border-sky-800">${edu.period}</span>
          </div>

          <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700/50">
            <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">Cumulative GPA</span>
            <span class="text-sm font-extrabold text-sky-600 dark:text-sky-400">${edu.gpa}</span>
          </div>

          <div class="text-xs text-slate-500 dark:text-slate-400">
            <span class="font-semibold text-slate-700 dark:text-slate-300">Key Coursework:</span> ${edu.coursework}
          </div>
        </div>
      `).join('');

      // 7. Contact CTA Section
      const c = data.contact || {};
      document.getElementById('contact').innerHTML = `
        <h2 class="text-2xl sm:text-4xl font-extrabold tracking-tight">${c.title || ""}</h2>
        <p class="max-w-2xl mx-auto text-sky-100 text-sm sm:text-base">${c.description || ""}</p>
        <div class="flex flex-col sm:flex-row justify-center items-center gap-3 sm:gap-4 pt-2">
          ${c.email ? `
          <a href="mailto:${c.email}" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-white text-slate-900 font-bold text-sm hover:bg-sky-50 transition shadow-sm">
            <i data-lucide="mail" class="w-4 h-4 text-sky-600"></i>
            <span>Send Email</span>
          </a>` : ''}
          ${c.linkedin ? `
          <a href="${c.linkedin}" target="_blank" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-sky-800/60 hover:bg-sky-800 text-white font-bold text-sm border border-sky-400/30 transition">
            ${SVG_ICONS.linkedinWhite}
            <span>Connect on LinkedIn</span>
          </a>` : ''}
        </div>
      `;

      // Icons & Filters
      lucide.createIcons();
      bindFilterEvents();
      bindMobileMenu();
    }

    function bindFilterEvents() {
      const filterButtons = document.querySelectorAll('.filter-btn');
      const projectCards = document.querySelectorAll('.project-card');

      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          filterButtons.forEach(b => {
            b.classList.remove('bg-sky-600', 'text-white');
            b.classList.add('bg-slate-200', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
          });

          btn.classList.add('bg-sky-600', 'text-white');
          btn.classList.remove('bg-slate-200', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');

          const filter = btn.getAttribute('data-filter');
          projectCards.forEach(card => {
            card.style.display = (filter === 'all' || card.getAttribute('data-category') === filter) ? 'flex' : 'none';
          });
        });
      });
    }

    function bindMobileMenu() {
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      const mobileMenuIcon = document.getElementById('mobileMenuIcon');

      if (mobileMenuBtn && mobileMenu) {
        mobileMenuBtn.onclick = () => {
          const isHidden = mobileMenu.classList.toggle('hidden');
          if (mobileMenuIcon) {
            mobileMenuIcon.setAttribute('data-lucide', isHidden ? 'menu' : 'x');
            lucide.createIcons();
          }
        };

        mobileMenu.onclick = (e) => {
          if (e.target.tagName === 'A') {
            mobileMenu.classList.add('hidden');
            if (mobileMenuIcon) {
              mobileMenuIcon.setAttribute('data-lucide', 'menu');
              lucide.createIcons();
            }
          }
        };
      }
    }

    // Dark Mode Toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
      themeIcon.setAttribute('data-lucide', 'sun');
    }

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    });

    // Fetch and render modular data.json
    fetch('./data.json')
      .then(response => {
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        return response.json();
      })
      .then(data => renderCV(data))
      .catch(err => console.error('Failed to load data.json:', err));
  </script>
</body>
</html>
