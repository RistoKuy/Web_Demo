<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    const SVG_ICONS = {
      github: '<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>',
      linkedin: '<svg class="w-4 h-4 fill-current text-sky-600 dark:text-sky-400" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>',
      linkedinWhite: '<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>'
    };
    const BADGE_COLORS = { indigo: 'bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800', emerald: 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800', sky: 'bg-sky-50 dark:bg-sky-950 text-sky-700 dark:text-sky-300 border-sky-200 dark:border-sky-800', amber: 'bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800', rose: 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800' };
  </script>
  <style>
    .tech-tag { display: inline-block; padding: .125rem .5rem; font-size: .7rem; font-weight: 500; border-radius: .375rem; background: #f1f5f9; color: #475569; border: 1px solid rgba(226,232,240,.8); }
    .dark .tech-tag { background: #1e293b; color: #cbd5e1; border-color: rgba(51,65,85,.8); }
    .link { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem .75rem; border: 1px solid #e2e8f0; border-radius: .5rem; font-weight: 500; }
    .dark .link { border-color: #334155; }
  </style>
</head>
<body x-data="portfolio()" x-init="load()" class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased transition-colors duration-300">
  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm overflow-hidden shrink-0">
          <template x-if="profile.avatar"><img :src="profile.avatar" :alt="profile.name" class="w-full h-full object-cover"></template>
          <template x-if="!profile.avatar"><span x-text="profile.initials"></span></template>
        </div>
        <div><span x-text="profile.name" class="font-bold text-base sm:text-lg tracking-tight block"></span><span x-text="profile.role" class="text-xs text-sky-600 dark:text-sky-400 font-medium"></span></div>
      </div>
      <nav class="hidden md:flex items-center space-x-1 lg:space-x-2 text-sm font-medium"><template x-for="item in navigation" :key="item.href"><a :href="item.href" x-text="item.label" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition"></a></template></nav>
      <div class="flex items-center space-x-2">
        <button @click="toggleTheme" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" aria-label="Toggle dark mode"><span x-show="dark"><i data-lucide="sun" class="w-4 h-4"></i></span><span x-show="!dark"><i data-lucide="moon" class="w-4 h-4"></i></span></button>
        <button @click="mobileOpen = !mobileOpen; $nextTick(() => lucide.createIcons())" class="md:hidden p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" aria-label="Open menu"><template x-if="mobileOpen"><i data-lucide="x" class="w-4 h-4"></i></template><template x-if="!mobileOpen"><i data-lucide="menu" class="w-4 h-4"></i></template></button>
      </div>
    </div>
    <nav x-show="mobileOpen" x-transition class="md:hidden border-t border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 px-4 py-3 space-y-1"><template x-for="item in navigation" :key="item.href"><a @click="mobileOpen = false" :href="item.href" x-text="item.label" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"></a></template></nav>
  </header>

  <main x-show="ready" class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-12">
    <section id="about" class="pt-4 sm:pt-8"><div class="bg-gradient-to-br from-white to-slate-100 dark:from-slate-900 dark:to-slate-800/60 rounded-3xl p-6 sm:p-10 border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden"><div class="absolute -right-16 -top-16 w-64 h-64 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
        <div class="lg:col-span-8 space-y-4">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 text-xs font-semibold border border-emerald-200 dark:border-emerald-800/60"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span x-text="profile.availability"></span></div>
          <div class="flex flex-col sm:flex-row sm:items-center gap-5 sm:gap-7"><template x-if="profile.avatar"><img :src="profile.avatar" :alt="profile.name" class="w-24 h-24 sm:w-32 sm:h-32 rounded-3xl object-cover ring-4 ring-white/80 dark:ring-slate-800 shadow-xl shrink-0"></template><div><h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white">Hi, I'm <span x-text="profile.name" class="bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent"></span></h1><p x-text="profile.headline" class="text-base sm:text-lg text-slate-600 dark:text-slate-300 font-medium mt-1.5"></p></div></div>
          <p x-text="profile.summary" class="text-slate-600 dark:text-slate-400 text-sm sm:text-base leading-relaxed"></p>
          <div class="flex flex-wrap gap-2.5 sm:gap-3 pt-2 text-xs sm:text-sm"><a :href="profile.linkedin" target="_blank" class="link" x-html="SVG_ICONS.linkedin + '<span>LinkedIn</span>'"></a><a :href="profile.github" target="_blank" class="link" x-html="SVG_ICONS.github + '<span>GitHub</span>'"></a><a :href="`mailto:${profile.email}`" class="link"><i data-lucide="mail" class="w-4 h-4 text-red-500"></i><span>Email</span></a><a x-show="profile.portfolio" :href="profile.portfolio" target="_blank" rel="noopener noreferrer" class="link"><i data-lucide="folder-git-2" class="w-4 h-4 text-sky-600"></i><span>Portfolio</span></a><span class="link"><i data-lucide="map-pin" class="w-4 h-4 text-emerald-500"></i><span x-text="profile.location"></span></span></div>
        </div>
        <div class="lg:col-span-4 bg-white dark:bg-slate-800/90 rounded-2xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4"><div class="border-b border-slate-100 dark:border-slate-700 pb-3"><div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Cumulative GPA</div><div class="text-4xl font-black text-sky-600 dark:text-sky-400 mt-1" x-text="metrics.gpa + ' / ' + metrics.gpaMax"></div><div x-text="metrics.gpaHonors" class="text-xs text-emerald-600 dark:text-emerald-400 font-medium mt-0.5"></div></div><div class="grid grid-cols-2 gap-4"><div><div class="text-xs text-slate-400 font-semibold">Core Focus</div><div x-text="metrics.coreFocus" class="text-sm font-bold mt-1"></div></div><div><div class="text-xs text-slate-400 font-semibold">Graduation</div><div x-text="metrics.graduation" class="text-sm font-bold mt-1"></div></div></div><a href="#contact" class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-sky-600 text-white font-semibold text-sm"><i data-lucide="send" class="w-4 h-4"></i>Get In Touch</a></div>
      </div>
    </div></section>

    <section id="projects" class="space-y-6"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-4"><div><h2 class="text-2xl font-bold flex items-center gap-2"><i :data-lucide="headers.projects.icon || 'folder-git-2'" class="w-6 h-6 text-sky-600"></i><span x-text="headers.projects.title"></span></h2><p x-text="headers.projects.subtitle" class="text-sm text-slate-500 dark:text-slate-400 mt-1"></p></div><div class="flex gap-1.5 overflow-x-auto"><template x-for="category in categories" :key="category.id"><button @click="filter = category.id" x-text="category.label" :class="filter === category.id ? 'bg-sky-600 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300'" class="shrink-0 px-3 py-1 text-xs font-semibold rounded-full"></button></template></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><template x-for="project in projects.filter(p => filter === 'all' || p.category === filter)" :key="project.title"><article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm flex flex-col justify-between"><div><div class="flex items-start justify-between gap-2"><div><span x-text="project.badge" :class="BADGE_COLORS[project.badgeColor] || BADGE_COLORS.sky" class="inline-block px-2.5 py-0.5 text-xs font-bold rounded-md border mb-2"></span><h3 x-text="project.title" class="font-bold text-lg"></h3></div><span x-text="project.period" class="text-xs text-slate-400 whitespace-nowrap"></span></div><p x-text="project.summary" class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed"></p><ul class="text-xs text-slate-600 dark:text-slate-300 space-y-2 mt-4"><template x-for="highlight in project.highlights"><li class="flex items-start gap-2.5"><span class="w-1.5 h-1.5 rounded-full bg-sky-500 mt-1.5 shrink-0"></span><span x-html="highlight"></span></li></template></ul></div><div class="pt-4 mt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-3"><div><template x-for="tag in project.tags"><span x-text="tag" class="tech-tag mr-1"></span></template></div><a x-show="project.link" :href="project.link" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-semibold text-sky-600"><span>View Project</span><i data-lucide="external-link" class="w-3.5 h-3.5"></i></a></div></article></template></div></section>

    <section id="skills" class="space-y-6"><div class="border-b border-slate-200 dark:border-slate-800 pb-4"><h2 class="text-2xl font-bold flex items-center gap-2"><i :data-lucide="headers.skills.icon || 'cpu'" class="w-6 h-6 text-sky-600"></i><span x-text="headers.skills.title"></span></h2><p x-text="headers.skills.subtitle" class="text-sm text-slate-500 mt-1"></p></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"><template x-for="category in skills" :key="category.title"><div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 space-y-4 shadow-sm"><div class="flex items-center gap-3 font-bold"><div class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800"><i :data-lucide="category.icon" class="w-5 h-5"></i></div><h3 x-text="category.title"></h3></div><ul class="space-y-2.5 text-sm text-slate-600 dark:text-slate-300"><template x-for="skill in category.skills"><li x-text="typeof skill === 'string' ? skill : skill.name" class="flex items-center gap-2.5"></li></template></ul></div></template></div></section>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8"><template x-for="section in [{ id: 'experience', title: headers.experience.title, icon: headers.experience.icon, items: experience }, { id: 'education', title: headers.education.title, icon: headers.education.icon, items: education }]" :key="section.id"><section :id="section.id" class="space-y-6"><h2 class="text-xl font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-4"><i :data-lucide="section.icon" class="w-5 h-5 text-sky-600"></i><span x-text="section.title"></span></h2><template x-for="item in section.items"><div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm space-y-3"><div class="flex justify-between items-start gap-3"><div><h3 x-text="item.role || item.institution" class="font-bold"></h3><div x-text="item.organization || item.degree" class="text-sm text-sky-600"></div></div><span x-text="item.period" class="text-xs text-slate-400 whitespace-nowrap"></span></div><template x-if="item.highlights"><ul class="text-sm space-y-2"><template x-for="highlight in item.highlights"><li x-html="highlight"></li></template></ul></template><div x-show="item.gpa" x-text="'Cumulative GPA: ' + item.gpa" class="text-sm font-bold text-sky-600"></div><p x-show="item.coursework" x-text="item.coursework" class="text-xs text-slate-500"></p></div></template></section></template></div>

    <section id="contact" class="bg-gradient-to-r from-sky-600 to-indigo-700 rounded-3xl p-8 sm:p-12 text-white shadow-lg text-center space-y-6"><h2 x-text="contact.title" class="text-2xl sm:text-4xl font-extrabold"></h2><p x-text="contact.description" class="max-w-2xl mx-auto text-sky-100"></p><div class="flex flex-col sm:flex-row justify-center items-center gap-3 sm:gap-4 pt-2"><a :href="`mailto:${contact.email}`" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-white text-slate-900 font-bold text-sm"><i data-lucide="mail" class="w-4 h-4 text-sky-600"></i>Send Email</a><a :href="contact.linkedin" target="_blank" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-sky-800/60 text-white font-bold text-sm border border-sky-400/30" x-html="SVG_ICONS.linkedinWhite + '<span>Connect on LinkedIn</span>'"></a></div></section>
  </main>
  <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500"><span>&copy; <span x-text="new Date().getFullYear()"></span> <span x-text="profile.name"></span>. Built with Alpine.js.</span></footer>

  <script>
    function portfolio() {
      return {
        ready: false, dark: localStorage.theme === 'dark', mobileOpen: false, filter: 'all',
        profile: {}, metrics: {}, navigation: [], headers: {}, categories: [], projects: [], skills: [], experience: [], education: [], contact: {},
        async load() {
          if (this.dark) document.documentElement.classList.add('dark');
          Object.assign(this, await fetch('./data.json').then(response => response.json()).then(data => ({
            ready: true, ...data, headers: data.sectionHeaders || {}, skills: data.skillCategories || [], categories: data.projectCategories || []
          })));
          document.title = this.meta.title;
          this.$nextTick(() => lucide.createIcons());
        },
        toggleTheme() { this.dark = !this.dark; document.documentElement.classList.toggle('dark', this.dark); localStorage.theme = this.dark ? 'dark' : 'light'; }
      };
    }
  </script>
</body>
</html>
